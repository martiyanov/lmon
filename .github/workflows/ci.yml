name: CI

# Linux-раннеры для публичных репозиториев бесплатны; macOS/Windows
# отключены из-за биллинга — их покрывает локальная scripts/test-all.sh.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
