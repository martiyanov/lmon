name: Release

# Публикация релиза: тесты на ubuntu (бесплатно для публичного репо),
# затем goreleaser — он кросс-компилирует darwin/linux/windows сам,
# macOS-раннер не нужен. macOS/Windows runtime-тесты — локально
# (scripts/test-all.sh), CI их не запускает из-за биллинга.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
